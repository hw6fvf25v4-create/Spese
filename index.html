<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spese</title>
<meta name="description" content="Tracker personale di spese, entrate e mance">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spese">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f6f4; --card: #ffffff; --card2: #efefec; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --line: rgba(11,11,11,.09); --accent: #2a78d6; --accent-ink: #ffffff; --accent-soft: rgba(42,120,214,.12);
  --good: #006300; --bad: #c62f2f; --warn: #b77900; --warn-fill: #fab219; --crit-fill: #d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s0:#c3c2b7;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --r: 16px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0d; --card: #1a1a19; --card2: #262624; --ink: #ffffff; --ink2: #c3c2b7; --muted: #8f8d86;
    --line: rgba(255,255,255,.10); --accent: #3987e5; --accent-soft: rgba(57,135,229,.18);
    --good: #2fbf4a; --bad: #ef6b6b; --warn: #fab219;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#4a4a46;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body {
  font: 16px/1.35 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
input, textarea, select { -webkit-user-select: text; user-select: text; }
button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; border: 0; background: none; padding: 0; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#view {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  padding: calc(var(--sat) + 8px) calc(var(--sar) + 16px) 24px calc(var(--sal) + 16px);
}
.wrap { max-width: 560px; margin: 0 auto; }
h1 { font-size: 30px; line-height: 1.15; font-weight: 700; margin: 10px 0 12px; letter-spacing: -.02em; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 4px 8px; }
h3 { font-size: 17px; font-weight: 650; margin: 0 0 12px; }
p { margin: 0 0 10px; }
small, .small { font-size: 13px; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink2); }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--good); }
.neg { color: var(--ink); }
.card { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; }
.hidden { display: none !important; }
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.topbar h1 { margin-bottom: 12px; }

/* barra in basso */
#tabbar {
  display: flex; background: var(--card); background: color-mix(in srgb, var(--card) 88%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--line);
  padding: 6px calc(var(--sar) + 4px) calc(var(--sab) + 4px) calc(var(--sal) + 4px);
}
#tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 2px; min-height: 50px; color: var(--muted); font-size: 11px; font-weight: 500; }
#tabbar button svg { width: 26px; height: 26px; }
#tabbar button.on { color: var(--accent); }

/* pulsanti */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; background: var(--card2); color: var(--ink); font-weight: 600; font-size: 16px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.big { min-height: 56px; font-size: 18px; width: 100%; border-radius: 16px; }
.btn.block { width: 100%; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn:active, .tile:active, .chip:active, .key:active, .tx:active, .cat:active, .freq button:active { transform: scale(.97); opacity: .85; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.link { color: var(--accent); font-weight: 600; padding: 8px 4px; min-height: 44px; }
.iconbtn { width: 44px; height: 44px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; background: var(--card2); font-size: 18px; flex: none; }

/* segmented */
.seg { display: inline-flex; background: var(--card2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { min-height: 38px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 15px; color: var(--ink2); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
@media (prefers-color-scheme: dark) { .seg button.on { background: #3a3a37; } }
.seg.full { display: flex; } .seg.full button { flex: 1; padding: 0 4px; font-size: 14px; }
.bal .l { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.bal .hero { font-size: 34px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.bal b { font-size: 18px; display: block; margin-top: 2px; }

/* chip */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 19px; background: var(--card2); font-weight: 600; font-size: 15px; white-space: nowrap; flex: none; }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.chip input[type=date], .overlay-input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; -webkit-appearance: none; appearance: none; }

/* griglia categorie */
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cat { background: var(--card); border-radius: var(--r); min-height: 88px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: var(--shadow); text-align: center; }
.cat .e { font-size: 30px; line-height: 1; }
.cat .n { font-size: 13px; font-weight: 600; line-height: 1.15; color: var(--ink2); }
.cat.sug { outline: 2.5px solid var(--accent); }
.cats.compact .cat { min-height: 72px; }
.cats.compact .cat .e { font-size: 24px; }
.cats.dense { grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cats.dense .cat { min-height: 68px; padding: 8px 3px; gap: 4px; border-radius: 14px; }
.cats.dense .cat .e { font-size: 22px; }
.cats.dense .cat .n { font-size: 11.5px; }

/* frequenti */
.freq { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.freq button { background: var(--card); border-radius: 14px; padding: 12px; min-height: 60px; text-align: left; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
.freq .e { font-size: 24px; }
.freq b { display: block; font-size: 17px; }
.freq span.t { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--muted); font-size: 14px; padding: 14px; border: 1.5px dashed var(--line); border-radius: 14px; text-align: center; }

/* importo e tastierino */
.amount { font-size: 46px; font-weight: 700; letter-spacing: -.02em; text-align: center; font-variant-numeric: tabular-nums; min-height: 60px; line-height: 60px; }
.amount.zero { color: var(--muted); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key { min-height: 56px; border-radius: 14px; background: var(--card2); font-size: 26px; font-weight: 500; display: flex; align-items: center; justify-content: center; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
.quick button { min-height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 17px; }

/* input */
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 13px; color: var(--muted); margin: 0 4px 6px; }
.inp { width: 100%; min-height: 48px; border-radius: 12px; border: 0; background: var(--card2); padding: 0 14px; font-size: 17px; outline: none; }
.inp:focus { box-shadow: 0 0 0 2px var(--accent); }
textarea.inp { padding: 12px 14px; min-height: 80px; resize: vertical; }
select.inp { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
input[type=date].inp { -webkit-appearance: none; appearance: none; display: flex; align-items: center; }
.list { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; }
.li { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 16px; width: 100%; text-align: left; border-bottom: 0.5px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .chev { color: var(--muted); font-size: 20px; }
.li .e { font-size: 22px; width: 30px; text-align: center; flex: none; }
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch i { position: absolute; inset: 0; border-radius: 16px; background: var(--card2); transition: background .2s; border: 1px solid var(--line); }
.switch i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 25px; height: 25px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch input:checked + i { background: #34c759; }
.switch input:checked + i::after { transform: translateX(20px); }

/* saldi / riepilogo */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.tile { background: var(--card); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); min-width: 0; }
.tile .l { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.tile .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tiles.two { grid-template-columns: 1fr 1fr; }
.monthnav { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 10px; }
.monthnav b { font-size: 19px; }
.kpi { display: grid; grid-template-columns: 1fr auto; row-gap: 8px; align-items: baseline; }
.kpi .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.kpi .sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-top: -4px; }
.kpi hr { grid-column: 1 / -1; border: 0; border-top: 0.5px solid var(--line); margin: 2px 0; width: 100%; }
.donut-wrap { display: flex; justify-content: center; margin: 4px 0 12px; }
.legend .li { min-height: 44px; padding: 6px 0; border-bottom: 0.5px solid var(--line); }
.legend .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.bar { height: 8px; border-radius: 4px; background: var(--card2); overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.bar.warn > i { background: var(--warn-fill); }
.bar.crit > i { background: var(--crit-fill); }
.budget { padding: 10px 0; border-bottom: 0.5px solid var(--line); }
.budget:last-child { border-bottom: 0; }
.flag { font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
.budget .num { white-space: nowrap; }
.flag.warn { background: rgba(250,178,25,.2); color: var(--warn); }
.flag.crit { background: rgba(208,59,59,.15); color: var(--bad); }

/* movimenti */
.dayhead { font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 4px 6px; display: flex; justify-content: space-between; }
.tx { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 14px; min-height: 58px; border-bottom: 0.5px solid var(--line); background: var(--card); }
.tx:last-child { border-bottom: 0; }
.tx .e { font-size: 22px; width: 30px; text-align: center; flex: none; }
.tx .mid { flex: 1; min-width: 0; }
.tx .mid b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .mid small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .a { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx .a.x { color: var(--muted); }
.txgroup { border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.badge { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--card2); color: var(--ink2); margin-left: 6px; vertical-align: 1px; }

/* mance */
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x proximity; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.strip::-webkit-scrollbar { display: none; }
.day { flex: none; width: 50px; min-height: 70px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; scroll-snap-align: center; }
.day .w { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.day .d { font-size: 20px; font-weight: 700; }
.day .m { font-size: 11px; color: var(--good); font-weight: 700; min-height: 14px; }
.day.on { background: var(--accent); color: var(--accent-ink); }
.day.on .w, .day.on .m { color: var(--accent-ink); }
.day.today:not(.on) { outline: 2px solid var(--accent-soft); }
.monthsep { flex: none; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; align-self: center; }

/* import */
.progress { height: 6px; border-radius: 3px; background: var(--card2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s; }
.desc { font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink2); background: var(--card2); border-radius: 10px; padding: 10px 12px; word-break: break-word; -webkit-user-select: text; user-select: text; }
.bigamt { font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.sug-line { font-size: 14px; color: var(--accent); font-weight: 600; margin-top: 8px; }
.actions3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.actions3 .btn { min-height: 48px; padding: 0 6px; font-size: 15px; }
.actions3 .btn.sug { outline: 2.5px solid var(--accent); }
.stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid var(--line); }
.stat:last-child { border-bottom: 0; }

/* banner */
#banner:empty { display: none; }
#banner { padding: calc(var(--sat) + 8px) 16px 10px; background: var(--accent); color: var(--accent-ink); font-size: 15px; }
#banner .row { max-width: 560px; margin: 0 auto; }
#banner button { color: var(--accent-ink); font-weight: 700; }
#banner + #view { padding-top: 8px; }

/* sheet e dialog */
#sheet-root, #dialog-root { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
#dialog-root { z-index: 60; }
.backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.35); opacity: 0; transition: opacity .22s; }
.open { pointer-events: auto !important; }
.open.show .backdrop { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - var(--sat) - 12px); overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--bg); border-radius: 20px 20px 0 0; padding: 8px calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);
  transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); overscroll-behavior: contain;
}
.open.show .sheet { transform: none; }
.sheet .inner { max-width: 560px; margin: 0 auto; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 8px; }
.sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.sheet-head .e { font-size: 28px; }
.sheet-head b { font-size: 19px; flex: 1; }
.dialog { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -46%) scale(.96); opacity: 0; transition: all .18s; width: min(340px, calc(100% - 40px)); max-height: 80%; overflow-y: auto; background: var(--card); border-radius: 18px; padding: 20px 18px 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.open.show .dialog { transform: translate(-50%, -50%); opacity: 1; }
.dialog h3 { text-align: center; margin-bottom: 6px; }
.dialog p { text-align: center; color: var(--ink2); font-size: 15px; }
.dialog .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }

#toast { position: fixed; left: 50%; top: calc(var(--sat) + 10px); transform: translate(-50%, -20px); opacity: 0; transition: all .22s; z-index: 70; background: #1f1f1d; color: #fff; border-radius: 14px; padding: 12px 16px; font-size: 15px; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25); pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast button { color: #6fb0ff; font-weight: 700; min-height: 32px; }
@media (prefers-color-scheme: dark) { #toast { background: #3a3a37; } }

.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.emojis { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 8px 0 12px; }
.emojis button { font-size: 24px; min-height: 42px; border-radius: 10px; }
.emojis button.on { background: var(--accent-soft); }
.merch { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 0.5px solid var(--line); }
.merch:last-child { border-bottom: 0; }
.merch .n { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.merch select.pill { flex: none; width: 76px; border: 0; -webkit-appearance: none; appearance: none; text-align: center; font-family: inherit; }
.merch .pill { flex: none; }
.pill { font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: var(--card2); color: var(--ink2); min-height: 32px; }
.pill.on { background: rgba(250,178,25,.22); color: var(--warn); }
.err { border: 1.5px solid var(--bad); }
.note { font-size: 13px; color: var(--muted); margin: 6px 4px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="banner"></div>
  <main id="view"></main>
  <nav id="tabbar">
    <button data-act="tab" data-tab="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Aggiungi</button>
    <button data-act="tab" data-tab="tips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="9" cy="7" rx="6" ry="2.6"/><path d="M3 7v4c0 1.4 2.7 2.6 6 2.6s6-1.2 6-2.6V7"/><path d="M3 11v4c0 1.4 2.7 2.6 6 2.6"/><ellipse cx="15.5" cy="15" rx="5.5" ry="2.4"/><path d="M10 15v3.4c0 1.3 2.5 2.4 5.5 2.4s5.5-1.1 5.5-2.4V15"/></svg>Mance</button>
    <button data-act="tab" data-tab="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Riepilogo</button>
    <button data-act="tab" data-tab="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M7.5 9.5 12 14l4.5-4.5"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Importa</button>
    <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>Impostazioni</button>
  </nav>
</div>
<div id="sheet-root"></div>
<div id="dialog-root"></div>
<div id="toast"></div>
<script>
/* ===== Parser movimenti bancari (Intesa Sanpaolo e simili) ===== */
const Parser = (() => {
  'use strict';

  // ---------- utilità testo ----------
  const stripAccents = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '');
  // Normalizzazione per confronti: MAIUSCOLO, solo lettere/numeri separati da spazio
  const norm = s => stripAccents(s).toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
  const normHeader = s => stripAccents(s).toLowerCase().replace(/[:.]+$/g, '').replace(/\s+/g, ' ').trim();
  const cleanSpaces = s => String(s == null ? '' : s).replace(/[  -​  　]/g, ' ').replace(/\s+/g, ' ').trim();

  // ---------- importi ----------
  function parseAmount(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    let s = String(v).replace(/[\s  -​  　]/g, '').replace(/€|EUR|euro/gi, '');
    if (!s) return null;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (/^[-−–]/.test(s)) { neg = true; s = s.slice(1); } else if (s[0] === '+') s = s.slice(1);
    if (/[-−]$/.test(s)) { neg = true; s = s.slice(0, -1); }
    if (!/^[\d.,']+$/.test(s) || !/\d/.test(s)) return null;
    s = s.replace(/'/g, '');
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc >= 0 && ld >= 0) {
      if (lc > ld) s = s.replace(/\./g, '').replace(',', '.');   // 1.234,56
      else s = s.replace(/,/g, '');                               // 1,234.56
    } else if (lc >= 0) {
      const parts = s.split(',');
      s = parts.length > 2 ? parts.slice(0, -1).join('') + '.' + parts[parts.length - 1] : s.replace(',', '.');
    } else if (/^\d{1,3}(\.\d{3})+$/.test(s)) {
      s = s.replace(/\./g, '');                                   // 1.500 = millecinquecento
    }
    const n = parseFloat(s);
    if (!isFinite(n)) return null;
    return neg ? -n : n;
  }
  const toCents = n => Math.round(Math.abs(n) * 100);

  // ---------- date ----------
  const pad = n => String(n).padStart(2, '0');
  const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  function validYMD(y, m, d) {
    if (y < 1990 || y > 2100) return false;
    const dt = new Date(Date.UTC(y, m - 1, d));
    return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
  }
  function serialToYMD(n) {
    if (n < 25000 || n > 80000) return null; // ~1968..2119
    const ms = Math.round((n - 25569) * 86400000); // 25569 = 1970-01-01
    const dt = new Date(ms);
    return ymd(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
  }
  function parseDate(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return serialToYMD(v);
    if (v instanceof Date) return isNaN(v) ? null : ymd(v.getFullYear(), v.getMonth() + 1, v.getDate());
    const s = String(v).trim();
    let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})(?:\D|$)/);
    if (m) {
      let y = +m[3]; if (y < 100) y += 2000;
      return validYMD(y, +m[2], +m[1]) ? ymd(y, +m[2], +m[1]) : null;
    }
    m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return validYMD(+m[1], +m[2], +m[3]) ? ymd(+m[1], +m[2], +m[3]) : null;
    return null;
  }
  const dayNum = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 86400000;
  const daysBetween = (a, b) => Math.abs(dayNum(a) - dayNum(b));

  // Data reale dell'acquisto dentro la descrizione
  function purchaseDateFromDesc(desc, opDate) {
    if (!desc || !opDate) return null;
    const opN = dayNum(opDate);
    const ok = d => d && dayNum(d) <= opN + 2 && dayNum(d) >= opN - 45;
    let m = desc.match(/EFFETTUAT[OA]\s+IL\s+(\d{1,2})\/(\d{1,2})\/(\d{2,4})/i)
         || desc.match(/\b(?:DEL|IL)\s+(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s+(?:ALLE\s+)?(?:ORE\s+)?\d{1,2}[:.]\d{2}/i);
    if (m) {
      let y = +m[3]; if (y < 100) y += 2000;
      const d = validYMD(y, +m[2], +m[1]) ? ymd(y, +m[2], +m[1]) : null;
      if (ok(d)) return d;
    }
    m = desc.match(/(\d{2})\/(\d{2})\s*-\s*(\d{1,2})[:.](\d{2})/);
    if (m) {
      const dd = +m[1], mm = +m[2];
      let y = +opDate.slice(0, 4);
      let d = validYMD(y, mm, dd) ? ymd(y, mm, dd) : null;
      if (d && dayNum(d) > opN + 2) { y -= 1; d = validYMD(y, mm, dd) ? ymd(y, mm, dd) : null; }
      if (ok(d)) return d;
    }
    return null;
  }

  // ---------- riconoscimento intestazione ----------
  const RX = {
    datePrimary: /^(data( (contabile|contab|operazione|op|registrazione|movimento|transazione|acquisto))?|date|booking date)$/,
    dateValuta: /^(data valuta|valuta|data val|value date)$/,
    desc: /(descrizione|dettagli|dettaglio|operazione|causale|movimento|description|motivo)/,
    amount: /^(importo|importo (eur|euro|in euro|€)|ammontare|amount|importo \(eur\)|importo \(€\))$/,
    credit: /^(accrediti|accredito|entrate|entrata|avere|accrediti (eur|euro|in euro|\(eur\)))$/,
    debit: /^(addebiti|addebito|uscite|uscita|dare|addebiti (eur|euro|in euro|\(eur\)))$/,
  };

  function headerSignature(row) {
    return (row || []).map(c => normHeader(c)).filter(Boolean).join('|');
  }

  function classifyHeader(row) {
    const res = { dateCols: [], descCols: [], amount: null, credit: null, debit: null };
    (row || []).forEach((cell, c) => {
      if (cell == null || typeof cell !== 'string') return;
      const h = normHeader(cell);
      if (!h || h.length > 40) return;
      if (RX.datePrimary.test(h)) res.dateCols.push({ c, prio: 1 });
      else if (RX.dateValuta.test(h)) res.dateCols.push({ c, prio: 2 });
      else if (RX.amount.test(h)) { if (res.amount == null) res.amount = c; }
      else if (RX.credit.test(h)) { if (res.credit == null) res.credit = c; }
      else if (RX.debit.test(h)) { if (res.debit == null) res.debit = c; }
      else if (RX.desc.test(h) && !/valuta|data/.test(h)) res.descCols.push(c);
    });
    return res;
  }

  function cellText(v) {
    if (v == null) return '';
    return cleanSpaces(v);
  }

  // rows = array di array (sheet_to_json header:1)
  function detectLayout(rows) {
    const maxR = Math.min(rows.length, 120);
    for (let r = 0; r < maxR; r++) {
      const h = classifyHeader(rows[r]);
      const hasAmount = h.amount != null || h.credit != null || h.debit != null;
      if (!h.dateCols.length || !h.descCols.length || !hasAmount) continue;
      // verifica sul contenuto delle righe successive
      const sample = rows.slice(r + 1, r + 40).filter(row => row && row.some(v => v != null && v !== ''));
      if (!sample.length) continue;
      const dateCols = h.dateCols.filter(dc => {
        const n = sample.filter(row => parseDate(row[dc.c])).length;
        return n >= Math.max(1, sample.length * 0.4);
      });
      if (!dateCols.length) continue;
      dateCols.sort((a, b) => a.prio - b.prio);
      return {
        headerRow: r,
        signature: headerSignature(rows[r]),
        date: dateCols[0].c,
        date2: dateCols[1] ? dateCols[1].c : null,
        desc: h.descCols,
        amount: h.amount,
        credit: h.credit,
        debit: h.debit,
      };
    }
    return null;
  }

  // Nome intestatario scritto sopra la tabella (es. "Intestatario carta: ROSSI MARIO")
  function findHolder(rows, until) {
    for (let r = 0; r < Math.min(until == null ? 40 : until, rows.length); r++) {
      const row = rows[r] || [];
      for (let c = 0; c < row.length; c++) {
        if (typeof row[c] === 'string' && /intestatari/i.test(row[c])) {
          const inline = row[c].split(':')[1];
          if (inline && inline.trim().length > 2) return cleanSpaces(inline);
          for (let k = c + 1; k < row.length; k++) if (row[k] && typeof row[k] === 'string') return cleanSpaces(row[k]);
        }
      }
    }
    return null;
  }

  function extractRows(rows, L) {
    const out = [];
    for (let r = L.headerRow + 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row) continue;
      const d1 = parseDate(row[L.date]);
      const d2 = L.date2 != null ? parseDate(row[L.date2]) : null;
      if (!d1 && !d2) continue;
      let amt = null;
      if (L.amount != null) {
        amt = parseAmount(row[L.amount]);
      } else {
        const cr = L.credit != null ? parseAmount(row[L.credit]) : null;
        const db = L.debit != null ? parseAmount(row[L.debit]) : null;
        if (cr) amt = Math.abs(cr);
        else if (db) amt = -Math.abs(db);
      }
      if (amt == null || amt === 0) continue;
      // descrizione: unisce le colonne descrittive senza ripetizioni
      const parts = [];
      (Array.isArray(L.desc) ? L.desc : [L.desc]).forEach(c => {
        const t = cellText(row[c]);
        if (!t) return;
        const tn = norm(t);
        if (parts.some(p => norm(p).includes(tn))) return;
        for (let i = parts.length - 1; i >= 0; i--) if (tn.includes(norm(parts[i]))) parts.splice(i, 1);
        parts.push(t);
      });
      const desc = parts.sort((a, b) => a.length - b.length).join(' · ');
      const bookDate = d1 || d2;
      let opDate = bookDate;
      if (d1 && d2 && d2 < d1) opDate = d2;
      const pd = purchaseDateFromDesc(desc, bookDate);
      out.push({
        row: r,
        bookDate,
        date: pd || opDate,
        desc,
        amount: Math.abs(amt),
        cents: toCents(amt),
        dir: amt < 0 ? 'out' : 'in',
      });
    }
    return out;
  }

  // ---------- estrazione nome ----------
  const CITIES = ['MILANO','ROMA','TORINO','NAPOLI','GENOVA','BOLOGNA','FIRENZE','VENEZIA','VERONA','PADOVA','BRESCIA','BERGAMO','MONZA','COMO','LECCO','VARESE','PAVIA','CREMONA','LODI','SONDRIO','MANTOVA','TRENTO','BOLZANO','TREVISO','VICENZA','PARMA','MODENA','PIACENZA','REGGIO EMILIA','RIMINI','PISA','LIVORNO','LA SPEZIA','SAVONA','SANREMO','BARI','PALERMO','CATANIA','CAGLIARI','PESCARA','ANCONA','PERUGIA','TRIESTE','UDINE','NOVARA','ALESSANDRIA','ASTI','CUNEO','AOSTA','LEVANTO','MONTEROSSO AL MARE','MONTEROSSO','VERNAZZA','RIOMAGGIORE','MANAROLA','CORNIGLIA','SESTRI LEVANTE','LERICI','PORTOVENERE',
    'DALMINE','SERIATE','TREVIGLIO','ALBINO','NEMBRO','ALZANO LOMBARDO','ALZANO','RANICA','TORRE BOLDONE','VILLA DI SERIO','PRADALUNGA','CENE','GAZZANIGA','VERTOVA','CASNIGO','COLZATE','FIORANO AL SERIO','FIORANO','LEFFE','GANDINO','PEIA','CAZZANO SANT ANDREA','CAZZANO','PONTE NOSSA','PREMOLO','PARRE','CLUSONE','ROVETTA','CASTIONE DELLA PRESOLANA','ARDESIO','GROMO','VILLA D OGNA','PIARIO','GORNO','ONETA','SCANZOROSCIATE','PEDRENGO','GORLE','ORIO AL SERIO','AZZANO SAN PAOLO','STEZZANO','CURNO','MOZZO','PONTE SAN PIETRO','BREMBATE','OSIO SOTTO','OSIO SOPRA','VERDELLINO','ZINGONIA','CISERANO','TREVIOLO','LALLIO','GRASSOBBIO','CAVERNAGO','BAGNATICA','COSTA DI MEZZATE','GRUMELLO DEL MONTE','SARNICO','LOVERE','COSTA VOLPINO','PISOGNE','ISEO','ENDINE GAIANO','CASAZZA','TRESCORE BALNEARIO','TRESCORE','SAN PELLEGRINO TERME','ZOGNO','VILLA D ALME','ALME','SORISOLE','PALADINA','VALBREMBO','ROMANO DI LOMBARDIA','CARAVAGGIO','MARTINENGO','CALUSCO D ADDA','CAPRIATE SAN GERVASIO','ORIO','AMSTERDAM','DUBLIN','DUBLINO','LUXEMBOURG','LUSSEMBURGO','LONDON','LONDRA','PARIS','PARIGI','BERLIN','MADRID','BARCELONA','CORK','SAN FRANCISCO'];
  const CITY_SET = new Set(CITIES);
  const COUNTRY = new Set(['IT','ITA','ITALY','ITALIA','NL','NLD','IE','IRL','LU','LUX','GB','GBR','UK','DE','DEU','FR','FRA','ES','ESP','US','USA','CH','BE','AT']);
  const LEGAL = /\b(S\s?R\s?L\s?S?|S\s?N\s?C|S\s?A\s?S|S\s?P\s?A|S\s?C\s?A\s?R\s?L|SOC\s+COOP|SOCIETA\s+COOPERATIVA|COOP|E\s+C|DITTA|UNIPERSONALE|LTD|LIMITED|GMBH|INC|LLC|BV|SARL|SA)\b/g;
  const PROCESSOR = /^(SUMUP|SUM\s*UP|SQ|SQUP|SQU|PAYPAL|PP|ZETTLE_?|IZ|IZETTLE|STRIPE|NEXI|SATISPAY|GOOGLE|GPAY|PADDLE(?:\.NET)?|2CO(?:\.COM)?|FS|MOLLIE|PAYU|NAYAX|WORLDLINE|SUMUP\s*PAY)\s*\*+\s*/i;
  const BRANDS = [
    [/\bAMZN\b|\bAMAZON\b/, 'Amazon'], [/\bAPPLE\s*COM\b|\bITUNES\b/, 'Apple'], [/\bNETFLIX\b/, 'Netflix'],
    [/\bSPOTIFY\b/, 'Spotify'], [/\bDISNEY\s*PLUS\b|\bDISNEYPLUS\b/, 'Disney+'], [/\bMC\s*DONALD/, "McDonald's"],
    [/\bYOUTUBE\b/, 'YouTube'], [/\bUBER\s*EATS\b/, 'Uber Eats'], [/\bJUST\s*EAT\b/, 'Just Eat'],
    [/\bTRENITALIA\b/, 'Trenitalia'], [/\bTRENORD\b/, 'Trenord'], [/\bRYANAIR\b/, 'Ryanair'],
  ];
  const SMALL = new Set(['DI','DA','DEL','DELLA','DEI','LA','IL','LO','LE','GLI','I','E','ED','AL','ALLA','A','IN','SU','DE','D','L']);

  function titleCase(s) {
    return s.split(' ').filter(Boolean).map((w, i) => {
      if (/\d/.test(w) && /[A-Za-z]/.test(w)) return w.toUpperCase();
      const bare = w.replace(/[^A-Za-z]/g, '').toUpperCase();
      if (/^[A-Z]{1,2}$/.test(w.toUpperCase()) && !SMALL.has(bare) && i > 0) return w.toUpperCase();
      if (SMALL.has(bare) && i > 0) return w.toLowerCase();
      return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
    }).join(' ');
  }

  function stripTrailing(words, extraStrip) {
    let changed = true;
    while (changed && words.length > 1) {
      changed = false;
      for (let k = Math.min(4, words.length - 1); k >= 1; k--) {
        const tail = norm(words.slice(-k).join(' '));
        if (CITY_SET.has(tail) || (extraStrip && extraStrip.has(tail))) { words = words.slice(0, -k); changed = true; break; }
      }
      if (changed) continue;
      const last = words[words.length - 1];
      if (/\d/.test(last) || COUNTRY.has(last.toUpperCase().replace(/[^A-Z]/g, '')) || /^[-–·*.,\/]+$/.test(last)) { words = words.slice(0, -1); changed = true; }
    }
    return words;
  }

  // classifica il tipo di movimento
  function kindOf(desc, dir) {
    const d = ' ' + stripAccents(desc).toUpperCase() + ' ';
    if (dir === 'out' && /\bPRELIEV|\bPREL\.|\bATM\b|CASH\s*WITHDRAW|\bBANCOMAT\s+PREL/.test(d)) return 'withdraw';
    if (dir === 'in' && /\bVERS(AMENTO)?\.?\s*(DI\s+)?CONT(ANTI|\.)?|\bVERSAMENTO\s+(CONTANTI|CASH)|\bCASH\s*DEPOSIT/.test(d)) return 'deposit';
    if (/\bBONIFIC|\bBON\.\s|\bGIROCONTO|\bGIROFONDI|\bSEPA\s+CREDIT|\bSCT\b|\bEMOLUMENT|\bSTIPENDI|\bDISPOSTO\s+DA|\bA\s+FAVORE\s+DI|\bMITT(ENTE)?\.?\s*:|\bORDINANTE\b|\bBENEF(ICIARIO)?\.?\s*:/.test(d)) return 'transfer';
    if (/\bADDEBITO\s+(DIRETTO|SDD)|\bSDD\b|\bRID\b/.test(d)) return 'sdd';
    return 'card';
  }

  const LABELS = /\b(MITT(?:ENTE)?\.?|ORDINANTE|ORD\.|DISPOSTO\s+DA|DA\s+VOI\s+DISPOSTO|A\s+FAVORE\s+DI|FAVORE\s+DI|BENEF(?:ICIARIO)?\.?|CREDITORE|CRED\.|CAUSALE|INFO|NOTE|NOTA|MOTIVAZIONE|DESCRIZIONE|BIC|SWIFT|IBAN|COD\.?\s*DISP\.?|CRO|TRN|ID\s+(?:OPERAZIONE|MANDATO|CREDITORE)|MANDATO|RIF\.?|DATA\s+(?:ESECUZIONE|REGOLAMENTO|ORDINE)|BANCA)\b\s*:?/gi;

  function labelled(desc) {
    const found = [];
    let m; LABELS.lastIndex = 0;
    while ((m = LABELS.exec(desc))) found.push({ label: stripAccents(m[1]).toUpperCase().replace(/\s+/g, ' ').replace(/\.$/, ''), start: m.index, end: m.index + m[0].length });
    const res = {};
    found.forEach((f, i) => {
      const next = found[i + 1] ? found[i + 1].start : desc.length;
      const v = desc.slice(f.end, next).replace(/^[\s:.\-]+|[\s\-·,;]+$/g, '').trim();
      if (v && !(f.label in res)) res[f.label] = v;
    });
    return res;
  }

  function cleanPersonName(s) {
    let t = cleanSpaces(s).replace(/\bIT\d{2}[A-Z0-9]{10,}\b/gi, ' ').replace(/[0-9]{3,}/g, ' ');
    t = stripAccents(t).toUpperCase().replace(/[^A-Z0-9 .'&]/g, ' ');
    t = t.replace(LEGAL, ' ').replace(/\s+/g, ' ').trim();
    const w = t.split(' ').filter(Boolean).slice(0, 5);
    return titleCase(w.join(' ')).slice(0, 40);
  }

  function extractTransfer(desc, dir) {
    const L = labelled(desc);
    const pick = keys => { for (const k of keys) if (L[k]) return L[k]; return ''; };
    const senderKeys = ['MITT', 'MITTENTE', 'ORDINANTE', 'ORD', 'DISPOSTO DA'];
    const benefKeys = ['BENEF', 'BENEFICIARIO', 'A FAVORE DI', 'FAVORE DI', 'CREDITORE', 'CRED'];
    let cp = dir === 'in' ? pick(senderKeys) : pick(benefKeys);
    if (!cp && dir === 'in') {
      const m = desc.match(/\bDA\s+([A-Za-zÀ-ÿ' .&]{3,40}?)(?=\s+(?:PER|IBAN|BIC|CAUSALE|NOTE|INFO|COD|$)|[,;:]|$)/i);
      if (m && !/^VOI\b/i.test(m[1])) cp = m[1];
    }
    let causale = pick(['CAUSALE', 'INFO', 'NOTE', 'NOTA', 'MOTIVAZIONE', 'DESCRIZIONE']);
    if (!causale) { const m = desc.match(/\bPER\s+(.{3,60})$/i); if (m) causale = m[1]; }
    causale = cleanSpaces(causale).replace(/\bIT\d{2}[A-Z0-9]{10,}\b/gi, '').trim();
    if (causale.length > 80) causale = causale.slice(0, 80) + '…';
    return { name: cp ? cleanPersonName(cp) : '', causale, sender: pick(senderKeys), benef: pick(benefKeys) };
  }

  function cleanMerchant(desc, extraStrip) {
    let s = cleanSpaces(desc);
    // se c'è "PRESSO", il negozio è dopo l'ultimo PRESSO
    const pm = [...s.matchAll(/\bPRESSO\b/gi)];
    if (pm.length) s = s.slice(pm[pm.length - 1].index + 6);
    // prefissi dell'operazione
    s = s.replace(/^\s*(?:PAGAMENTO|PAGAM\.?|PAG\.?|ACQUISTO|ACQ\.?|ADDEBITO|OPERAZIONE|TRANSAZIONE)\s+(?:(?:TRAMITE|SU|CON|DA|MEZZO|MEDIANTE)\s+)?(?:POS|CARTA(?:\s+DI\s+(?:DEBITO|CREDITO))?|APPLE\s*PAY|GOOGLE\s*PAY|SAMSUNG\s*PAY|CONTACTLESS|BANCOMAT|INTERNET|ONLINE|E-?COMMERCE)?\s*/i, '');
    s = s.replace(/^\s*(?:POS|CARTA|APPLE\s*PAY|GOOGLE\s*PAY)\s+/i, '');
    s = s.replace(/^EFFETTUAT[OA]\s+IL\s+\S+(\s+ALLE\s+ORE\s+\S+)?\s*/i, '');
    // tagli: data/ora, carta, codici
    const cuts = [
      /\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\s*-\s*\d{1,2}[:.]\d{2}/,
      /\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/,

      /\bCOD\.?\s*[\d\/]/i, /\bABI\b/i, /\bCRO\b/i, /\bRIF\.?\s*\d/i,
      /\b\d{4}\s*[X*]{2,}/i, /\bX{4}\b/i, /\*{4}/,
      /\bRIV\.?\s*\d+/i, /\bFIL\.?\s*\d+/i,
      /\s(?:VIA|V\.LE|VIALE|V\.|PIAZZA|P\.ZZA|P\.ZA|PZA|P\.LE|PIAZZALE|CORSO|C\.SO|LARGO|LOC\.|LOCALITA'?|STRADA|STR\.|VICOLO|VIC\.|CONTRADA|FRAZ\.|FRAZIONE)\s/i,
    ];
    let cut = s.length;
    cuts.forEach(rx => { const m = s.match(rx); if (m && m.index > 0 && m.index < cut) cut = m.index; });
    s = s.slice(0, cut);
    // processori di pagamento
    s = s.trim().replace(PROCESSOR, '');
    // brand noti
    const n0 = norm(s) || norm(desc);
    for (const [rx, name] of BRANDS) if (rx.test(n0)) return name;
    // "MERCHANT* PRODOTTO" → MERCHANT
    const star = s.indexOf('*');
    if (star > 1) s = s.slice(0, star);
    else if (star === 0) s = s.slice(1);
    // "X DI PROPRIETARIO" → X
    const di = s.search(/\sDI\s/i);
    if (di > 0) s = s.slice(0, di);
    s = stripAccents(s).toUpperCase().replace(LEGAL, ' ');
    s = s.replace(/[^A-Z0-9.'&+\/ -]/g, ' ').replace(/\s+/g, ' ').trim();
    let words = s.split(' ').filter(Boolean);
    words = stripTrailing(words, extraStrip);
    // "WEEKDAY WEEKDA": ultima parola troncata uguale all'inizio della precedente
    while (words.length > 1) {
      const a = words[words.length - 2], b = words[words.length - 1];
      if (b.length >= 3 && a.startsWith(b)) words = words.slice(0, -1); else break;
    }
    let out = words.join(' ').replace(/[\s\-–·.,\/]+$/, '').trim();
    if (!out || out.length < 2) {
      out = norm(desc).split(' ').slice(0, 3).join(' ');
    }
    if (out.length > 40) out = out.slice(0, 40).trim();
    return titleCase(out);
  }

  function analyze(desc, dir, extraStrip) {
    const kind = kindOf(desc, dir);
    if (kind === 'withdraw') return { kind, name: 'Prelievo', causale: '' };
    if (kind === 'deposit') return { kind, name: 'Versamento contanti', causale: '' };
    if (kind === 'transfer' || kind === 'sdd') {
      const t = extractTransfer(desc, dir);
      if (t.name) return { kind, name: t.name, causale: t.causale, sender: t.sender, benef: t.benef };
      return { kind, name: cleanMerchant(desc.replace(/\b(ACCREDITO|ADDEBITO|BONIFICO|ISTANTANEO|SEPA|SDD|DIRETTO|DA VOI DISPOSTO|A VOSTRO FAVORE|DISPOSTO|N\.?\s*\d+)\b/gi, ' '), extraStrip), causale: t.causale };
    }
    return { kind, name: cleanMerchant(desc, extraStrip), causale: '' };
  }

  // l'altra parte del bonifico sono io?
  function isMe(name, myName) {
    const me = norm(myName).split(' ').filter(w => w.length >= 2);
    if (!me.length || !name) return false;
    const other = new Set(norm(name).split(' '));
    return me.every(w => other.has(w));
  }

  // contiene il nome salvato (a parole intere)?
  function containsName(haystackNorm, nameNorm) {
    if (!nameNorm) return false;

  }

})();

  if (KP.fresh && k === '⌫') s = KP.str;
  KP.fresh = false;
  if (k === '⌫') s = s.slice(0, -1);
  else if (k === ',') { if (!s.includes(',')) s = (s || '0') + ','; }
  else {
    const [i, dec] = s.split(',');
    if (dec != null && dec.length >= 2) return kpShake();
    if (dec == null && i.replace(/^0+/, '').length >= 6) return kpShake();
    s = s === '0' ? k : s + k;
  }
  KP.str = s;
  kpRender();
}

const kpValue = () => (KP && KP.str ? round2(num(KP.str.replace(/,$/, '')) || 0) : 0);

function frequentFor(type) {
  const from = addDays(today(), -120);
  const groups = new Map();
  S.tx.forEach(t => {
    if (t.kind !== type || t.date < from || t.recurringId) return;
    const k = t.catId + '|' + cents(t.amount);
    let g = groups.get(k);
    if (!g) groups.set(k, g = { catId: t.catId, amount: t.amount, n: 0, last: '', labels: new Map(), src: { conto: 0, contanti: 0 } });
    g.n++; if (t.date > g.last) g.last = t.date;
    const lb = (t.merchant || t.note || '').trim();
    if (lb) g.labels.set(lb, (g.labels.get(lb) || 0) + 1);
    g.src[t.source] = (g.src[t.source] || 0) + 1;
  });
  return [...groups.values()].filter(g => g.n >= 2 && cat(g.catId)).sort((a, b) => b.n - a.n || (a.last < b.last ? 1 : -1)).slice(0, 4).map(g => {
    let label = '';
    for (const [lb, n] of g.labels) if (n * 2 >= g.n && (!label || n > g.labels.get(label))) label = lb;
    return { catId: g.catId, amount: g.amount, label, source: g.src.conto > g.src.contanti ? 'conto' : 'contanti' };
  });
}

/* =====================================================================

   ===================================================================== */
function tipsStats(sel) {
  const tips = S.tx.filter(t => t.kind === 'tip' && t.amount > 0);
  const ws = addDays(sel, -wdMon(sel)), we = addDays(ws, 6), ym = monthOf(sel);
  let week = 0, month = 0, days = 0;
  const byWd = Array.from({ length: 7 }, () => ({ s: 0, n: 0 }));
  tips.forEach(t => {
    if (t.date >= ws && t.date <= we) week += t.amount;
    if (monthOf(t.date) === ym) { month += t.amount; days++; }
    const w = byWd[wdMon(t.date)]; w.s += t.amount; w.n++;
  });
  return { week, month, days, avg: days ? month / days : 0, byWd: byWd.map(w => ({ avg: w.n ? w.s / w.n : 0, n: w.n })), ws, we, total: tips.length };
}
function weekdayChart(byWd) {
  const W = 320, H = 150, top = 22, bottom = 26, gap = 12;
  const max = Math.max(...byWd.map(w => w.avg), 1);
  const bw = (W - gap * 8) / 7;
  const bars = byWd.map((w, i) => {
    const h = w.avg ? Math.max(4, (H - top - bottom) * w.avg / max) : 0;
    const x = gap + i * (bw + gap), y = H - bottom - h;
    const r = Math.min(4, h / 2);
    const path = h ? `M${x},${H - bottom} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${H - bottom} Z` : '';
    return `${path ? `<path d="${path}" fill="var(--s1)"/>` : ''}
      ${w.avg ? `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="var(--ink2)" font-weight="600">${fmtN.format(Math.round(w.avg))}</text>` : ''}
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--muted)">${WD_MON[i]}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mance medie per giorno della settimana"><line x1="${gap / 2}" x2="${W - gap / 2}" y1="${H - bottom}" y2="${H - bottom}" stroke="var(--line)"/>${bars}</svg>`;
}

function catColor(c) {

  return i >= 0 && i < 8 ? `var(--s${i + 1})` : 'var(--s0)';
}
function donut(parts, total) {
  const R = 64, SW = 22, C = 2 * Math.PI * R, gap = parts.length > 1 ? 2 : 0;
  let off = 0;
  const segs = parts.map(p => {
    const len = total ? (p.value / total) * C : 0;
    const dash = Math.max(len - gap, 0.8);
    const s = `<circle r="${R}" cx="80" cy="80" fill="none" stroke="${p.color}" stroke-width="${SW}" stroke-dasharray="${dash} ${C - dash}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;
    off += len; return s;
  }).join('');
  return `<svg viewBox="0 0 160 160" width="180" height="180" role="img" aria-label="Spese per categoria"><circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--card2)" stroke-width="${SW}"/>${segs}
    <text x="80" y="76" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">USCITE</text>
    <text x="80" y="96" text-anchor="middle" font-size="18" fill="var(--ink)" font-weight="700">${esc(eur(total))}</text></svg>`;
}
function txTitle(t) {

}
function txRow(t) {

let xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxPromise) return xlsxPromise;
  xlsxPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = XLSX_URL; s.async = true;
    s.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('libreria non caricata'));
    s.onerror = () => { xlsxPromise = null; s.remove(); rej(new Error('Serve la connessione la prima volta per scaricare il lettore Excel.')); };
    document.head.appendChild(s);
  });
  return xlsxPromise;
}
function readSheets(buf) {
  const wb = XLSX.read(buf, { type: 'array', raw: true, cellDates: false, dense: false });
  return wb.SheetNames.map(n => ({ name: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: true }) }));
}
function findLayout(rows) {
  for (let r = 0; r < Math.min(rows.length, 120); r++) {
    const sig = P.headerSignature(rows[r]);
    if (sig && S.maps[sig]) return Object.assign({}, S.maps[sig], { headerRow: r, signature: sig, saved: true });
  }
  return P.detectLayout(rows);
}
async function handleFile(file) {
  if (!file) return;
  UI.imp = { stage: 'loading', fileName: file.name }; render();
  try {
    await loadXLSX();
    const buf = await file.arrayBuffer();
    const sheets = readSheets(buf);
    let chosen = null;
    for (const sh of sheets) { const L = findLayout(sh.rows); if (L) { chosen = { sheet: sh, L }; break; } }
    if (!chosen) {
      const sh = sheets.slice().sort((a, b) => b.rows.length - a.rows.length)[0];
      if (!sh || !sh.rows.length) throw new Error('Il file sembra vuoto.');
      UI.imp = { stage: 'map', fileName: file.name, rows: sh.rows, map: guessMap(sh.rows) };
      render(); return;
    }
    prepareImport(file.name, chosen.sheet.rows, chosen.L);
  } catch (e) {
    console.error(e);
    UI.imp = { stage: 'error', fileName: file.name, msg: e && e.message || String(e) };
    render();
  }
}
function guessMap(rows) {
  let best = 0, bestN = -1;
  for (let r = 0; r < Math.min(rows.length, 60); r++) {
    const n = (rows[r] || []).filter(v => typeof v === 'string' && v.trim()).length;
    if (n > bestN) { bestN = n; best = r; }
  }
  return { headerRow: best, date: '', date2: '', desc: '', desc2: '', mode: 'split', amount: '', credit: '', debit: '' };
}

function prepareImport(fileName, rows, L) {
  const rowsX = P.extractRows(rows, L);
  if (!rowsX.length) { UI.imp = { stage: 'error', fileName, msg: 'Nessun movimento trovato nel file.' }; render(); return; }
  if (!S.settings.myName) {
    const h = P.findHolder(rows, L.headerRow);
    if (h) { S.settings.myName = h; save(); toast(`Nome impostato: ${h}`); }
  }
  const strip = extraStrip();
  const items = rowsX.map((r, i) => {
    const an = P.analyze(r.desc, r.dir, strip);
    return Object.assign(r, { i, name0: an.name, name: an.name, causale: an.causale, akind: an.kind, rn: P.norm(r.desc), mn: P.norm(an.name), status: null });
  });
  planImport(items);
  const dates = items.map(i => i.date).sort();
  UI.imp = { stage: 'preview', fileName, L, items, from: dates[0], to: dates[dates.length - 1], headers: rows[L.headerRow] || [], rowsRaw: rows };
  render();
}

function sameMerchant(a, b) {
  if (!a || !b) return false;
  if (a === b) return true;
  const ca = a.replace(/ /g, ''), cb = b.replace(/ /g, '');
  if (ca.length >= 3 && cb.length >= 3 && (ca.includes(cb) || cb.includes(ca))) return true;
  const fa = a.split(' ')[0], fb = b.split(' ')[0];
  return fa.length >= 4 && fa === fb;
}
function matchRule(it) {
  const type = it.dir === 'out' ? 'exp' : 'inc';
  const hays = [' ' + it.rn + ' ', ' ' + P.norm(it.name) + ' ', ' ' + it.mn + ' '];
  let best = null;
  for (const c of S.categories) {
    if (c.type !== type) continue;
    for (const m of c.merchants) {
      const n = P.norm(m.name);
      if (!n) continue;
      if (hays.some(h => h.includes(' ' + n + ' ')) && (!best || n.length > best.len)) best = { cat: c, m, len: n.length };
    }
  }
  return best;
}
function planImport(items) {
  // 1) duplicati: movimenti già importati (anche da un formato diverso)
  const pool = [], seen = new Set();
  S.tx.forEach(t => { if (!t.bank) return; const g = t.group || t.id; if (seen.has(g)) return; seen.add(g); pool.push({ t, used: false }); });
  items.forEach(it => {
    const p = pool.find(p => !p.used && p.t.bank.c === it.cents && p.t.bank.dir === it.dir && p.t.bank.d === it.date && (p.t.bank.r === it.rn || p.t.bank.m === it.mn));
    if (p) { p.used = true; it.status = 'dup'; }
  });
  items.forEach(it => {
    if (it.status) return;
    const cands = pool.filter(p => !p.used && p.t.bank.c === it.cents && p.t.bank.dir === it.dir && P.daysBetween(p.t.bank.d, it.date) <= 3 && sameMerchant(p.t.bank.m, it.mn));
    if (!cands.length) return;
    cands.sort((a, b) => P.daysBetween(a.t.bank.d, it.date) - P.daysBetween(b.t.bank.d, it.date));
    cands[0].used = true; it.status = 'dup';
  });
  // 2) collegamenti: spese ricorrenti generate in automatico e spese con carta inserite a mano
  const manual = S.tx.filter(t => !t.bank && t.source === 'conto' && (t.kind === 'exp' || t.kind === 'inc')).map(t => ({ t, used: false }));
  items.forEach(it => {
    if (it.status) return;
    let c = manual.filter(m => !m.used && m.t.recurringId && it.dir === 'out' && m.t.kind === 'exp' && P.daysBetween(m.t.date, it.date) <= 10 && nearAmount(it.amount, m.t.amount, .25) && (() => { const r = S.recurring.find(r => r.id === m.t.recurringId); return r ? recMatches(r, it.desc + ' ' + it.name) : false; })());
    if (!c.length) c = manual.filter(m => !m.used && !m.t.recurringId && m.t.kind === (it.dir === 'out' ? 'exp' : 'inc') && cents(m.t.amount) === it.cents && P.daysBetween(m.t.date, it.date) <= 3);
    if (!c.length) return;
    c.sort((a, b) => P.daysBetween(a.t.date, it.date) - P.daysBetween(b.t.date, it.date));
    c[0].used = true; it.status = 'linked'; it.linkTo = c[0].t.id; it.linkRec = !!c[0].t.recurringId;
  });
  // 3) regole per nome e suggerimenti
  const myName = S.settings.myName;
  items.forEach(it => {
    if (it.status) return;
    if (it.akind === 'withdraw') { it.status = 'review'; it.sug = 'withdraw'; return; }
    if (it.akind === 'deposit') { it.status = 'review'; it.sug = 'deposit'; return; }
    if ((it.akind === 'transfer') && (P.isMe(it.name, myName) || /GIROCONTO|GIROFONDI/.test(it.rn))) { it.status = 'review'; it.sug = 'ignore'; return; }
    const m = matchRule(it);
    if (m && !m.m.ask) { it.status = 'auto'; it.catId = m.cat.id; it.rule = m.m.name; return; }
    it.status = 'review';
    if (m) { it.sugCat = m.cat.id; it.askName = m.m.name; }
  });
}
const fpOf = it => ({ d: it.date, c: it.cents, dir: it.dir, m: it.mn, r: it.rn });
function txFromItem(it, extra) {
  return Object.assign({ id: uid(), source: 'conto', amount: round2(it.amount), date: it.date, bookDate: it.bookDate, merchant: it.name, note: it.causale || '', bankDesc: it.desc, bank: fpOf(it), imp: UI.imp.impId, created: Date.now() }, extra);
}
function startImport() {
  const imp = UI.imp;
  imp.impId = uid();
  imp.autoTx = []; imp.counts = { dup: 0, linked: 0, auto: 0, manual: 0, ignored: 0, transfer: 0 };
  imp.items.forEach(it => {
    if (it.status === 'dup') imp.counts.dup++;
    else if (it.status === 'linked') {
      const t = S.tx.find(x => x.id === it.linkTo);
      if (t) {
        t.bank = fpOf(it); t.bankDesc = it.desc; t.bookDate = it.bookDate;
        if (it.linkRec) { t.date = it.date; t.amount = round2(it.amount); }
        if (!t.merchant) t.merchant = it.name;
      }
      imp.counts.linked++;
    } else if (it.status === 'auto') {
      const t = txFromItem(it, { kind: it.dir === 'out' ? 'exp' : 'inc', catId: it.catId, auto: true });
      S.tx.push(t); imp.autoTx.push({ txId: t.id, rule: it.rule }); imp.counts.auto++;
    }
  });
  imp.queue = imp.items.filter(it => it.status === 'review');
  imp.pos = 0; imp.hist = [];
  imp.stage = imp.queue.length ? 'review' : 'done';
  if (!imp.queue.length) finishImportLog();
  save(); render();
}
function finishImportLog() {
  const imp = UI.imp;
  if (imp.logged) return; imp.logged = true;
  const added = imp.counts.auto + imp.counts.manual + imp.counts.ignored + imp.counts.transfer;
  S.imports.unshift({ at: Date.now(), file: imp.fileName, total: imp.items.length, added, dup: imp.counts.dup, linked: imp.counts.linked, from: imp.from, to: imp.to });
  S.imports = S.imports.slice(0, 15);
  save();
}
function curItem() { const imp = UI.imp; return imp && imp.queue[imp.pos]; }
function reviewDecide(kind, catId) {
  const imp = UI.imp, it = curItem(); if (!it) return;
  const nameEl = $('#r-name'), noteEl = $('#r-note'), remEl = $('#r-rem');
  it.name = nameEl ? nameEl.value.trim() : it.name;
  it.causale = noteEl ? noteEl.value.trim() : it.causale;
  const h = { pos: imp.pos, txIds: [], rule: null, autoResolved: [], count: null };
  if (kind === 'cat') {
    const t = txFromItem(it, { kind: it.dir === 'out' ? 'exp' : 'inc', catId });
    S.tx.push(t); h.txIds.push(t.id); h.count = 'manual';
    if (remEl && remEl.checked && it.name) {
      h.rule = addRule(catId, it.name);
      // applica subito la nuova regola alle transazioni ancora da rivedere
      for (let j = imp.pos + 1; j < imp.queue.length; j++) {
        const o = imp.queue[j];
        if (o.sug) continue;
        const m = matchRule(o);
        if (m && !m.m.ask) {
          const t2 = txFromItem(o, { kind: o.dir === 'out' ? 'exp' : 'inc', catId: m.cat.id, auto: true });
          S.tx.push(t2); imp.autoTx.push({ txId: t2.id, rule: m.m.name }); imp.counts.auto++;
          h.autoResolved.push({ item: o, idx: j, txId: t2.id });
        }
      }
      h.autoResolved.slice().reverse().forEach(a => imp.queue.splice(a.idx, 1));
    }
  } else if (kind === 'transfer') {
    const t = txFromItem(it, { kind: 'transfer', xfer: it.dir === 'out' ? 'withdraw' : 'deposit' });
    S.tx.push(t); h.txIds.push(t.id); h.count = 'transfer';
  } else if (kind === 'ignore') {
    const t = txFromItem(it, { kind: 'ignored', dir: it.dir });
    S.tx.push(t); h.txIds.push(t.id); h.count = 'ignored';
  } else if (kind === 'split') {
    const group = uid();
    catId.forEach(p => { const t = txFromItem(it, { kind: it.dir === 'out' ? 'exp' : 'inc', catId: p.catId, amount: p.amount, group }); S.tx.push(t); h.txIds.push(t.id); });
    h.count = 'manual';
  }
  imp.counts[h.count]++;
  imp.hist.push(h);
  imp.pos++;
  if (imp.pos >= imp.queue.length) { imp.stage = 'done'; finishImportLog(); }
  save(); render();
  $('#view').scrollTop = 0;
}
function reviewBack() {
  const imp = UI.imp; if (!imp || !imp.hist.length) return;
  const h = imp.hist.pop();
  S.tx = S.tx.filter(t => !h.txIds.includes(t.id) && !h.autoResolved.some(a => a.txId === t.id));
  h.autoResolved.forEach(a => { imp.queue.splice(a.idx, 0, a.item); imp.autoTx = imp.autoTx.filter(x => x.txId !== a.txId); imp.counts.auto--; });
  if (h.rule) undoRule(h.rule);
  imp.counts[h.count]--;
  imp.pos = h.pos;
  save(); render();
}
function addRule(catId, name) {
  const n = P.norm(name);
  const undo = { catId, name, removed: [] };
  S.categories.forEach(c => {
    const i = c.merchants.findIndex(m => P.norm(m.name) === n);
    if (i >= 0) { undo.removed.push({ catId: c.id, m: c.merchants[i], i }); c.merchants.splice(i, 1); }
  });
  const c = cat(catId);
  const keepAsk = undo.removed.some(r => r.m.ask);
  c.merchants.push({ name, ask: keepAsk });
  return undo;
}
function undoRule(u) {
  const c = cat(u.catId);
  if (c) { const i = c.merchants.map(m => m.name).lastIndexOf(u.name); if (i >= 0) c.merchants.splice(i, 1); }
  u.removed.forEach(r => { const c2 = cat(r.catId); if (c2) c2.merchants.splice(Math.min(r.i, c2.merchants.length), 0, r.m); });
}

/* --- backup --- */
function shareOrDownload(blob, name, type) {
  const file = new File([blob], name, { type });
  if (navigator.canShare && navigator.share) {
    try {
      if (navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title: name }).then(() => true, e => (e && e.name === 'AbortError') ? false : downloadBlob(blob, name));
    } catch (e) { /* ripiego */ }
  }
  return Promise.resolve(downloadBlob(blob, name));
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
  return true;
}
function exportBackup() {
  const data = JSON.stringify({ app: 'tracker-spese', format: 1, version: APP_VERSION, exportedAt: new Date().toISOString(), state: S }, null, 1);
  shareOrDownload(new Blob([data], { type: 'application/json' }), `backup-spese-${today()}.json`, 'application/json').then(ok => {
    if (ok) { S.settings.lastBackup = Date.now(); save(); render(); toast('Backup esportato'); }
  });
}
function exportCSV() {
  const q = v => { const s = String(v == null ? '' : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const kindL = { exp: 'Spesa', inc: 'Entrata', tip: 'Mance', transfer: 'Trasferimento', ignored: 'Ignorato' };
  const rows = [['Data', 'Tipo', 'Fonte', 'Categoria', 'Nome', 'Nota', 'Importo', 'Descrizione banca']];
  S.tx.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).forEach(t => {
    const sign = t.kind === 'exp' || (t.kind === 'ignored' && t.dir !== 'in') || (t.kind === 'transfer' && t.xfer !== 'deposit') ? -1 : 1;
    rows.push([fmtIt(t.date), kindL[t.kind] || t.kind, t.kind === 'tip' ? 'Mance' : t.source === 'conto' ? 'Conto' : 'Contanti', (t.kind === 'exp' || t.kind === 'inc') ? catName(t.catId) : t.kind === 'transfer' ? (t.xfer === 'deposit' ? 'Versamento' : 'Prelievo') : '', t.merchant || '', t.note || '', fmt2.format(sign * t.amount).replace(/\./g, ''), t.bankDesc || '']);
  });
  const csv = '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n');
  shareOrDownload(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `movimenti-${today()}.csv`, 'text/csv').then(ok => { if (ok) toast('CSV esportato'); });
}
async function restoreBackup(file) {
  if (!file) return;
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { return ask({ title: 'File non valido', msg: 'Questo file non è un backup leggibile (JSON danneggiato).', buttons: [{ label: 'OK', value: 1, style: 'primary' }] }); }
  const st = obj && typeof obj === 'object' ? (obj.state && typeof obj.state === 'object' ? obj.state : obj) : null;
  if (!st || (!Array.isArray(st.tx) && !Array.isArray(st.categories))) return ask({ title: 'File non valido', msg: 'Non sembra un backup di questa app.', buttons: [{ label: 'OK', value: 1, style: 'primary' }] });
  const clean = sanitize(st);
  const when = obj.exportedAt ? new Date(obj.exportedAt).toLocaleString('it-IT', { dateStyle: 'medium', timeStyle: 'short' }) : 'data sconosciuta';
  const dropped = Array.isArray(st.tx) ? st.tx.length - clean.tx.length : 0;
  if (!await confirmBox('Ripristinare il backup?', `Backup del ${esc(when)} con ${clean.tx.length} movimenti${dropped > 0 ? ` (${dropped} righe danneggiate scartate)` : ''}.<br><br>I dati attuali verranno sostituiti.`, 'Ripristina', true)) return;
  try { await Store.put('pre-restore', JSON.stringify(S)); } catch (e) { /* copia di sicurezza facoltativa */ }
  S = clean; UI.imp = null; UI.fCat = '';
  runRecurring(); await flush(); render(); toast('Backup ripristinato');
}
async function wipeAll() {
  if (!await confirmBox('Cancellare tutti i dati?', 'Movimenti, mance, categorie e impostazioni verranno eliminati da questo iPhone.', 'Continua', true)) return;
  if (!await confirmBox('Sei sicuro?', 'Non si può annullare. Hai un backup?', 'Cancella tutto', true)) return;
  try { await Store.put('pre-wipe', JSON.stringify(S)); } catch (e) { /* */ }

  const rows = prev.rowsRaw;
  UI.imp = { stage: 'map', fileName: prev.fileName, rows, map: Object.assign(guessMap(rows), { headerRow: prev.L.headerRow, date: prev.L.date, date2: prev.L.date2 == null ? '' : prev.L.date2, desc: (prev.L.desc || [])[0], desc2: (prev.L.desc || [])[1] == null ? '' : prev.L.desc[1], mode: prev.L.amount != null ? 'single' : 'split', amount: prev.L.amount == null ? '' : prev.L.amount, credit: prev.L.credit == null ? '' : prev.L.credit, debit: prev.L.debit == null ? '' : prev.L.debit }) };
  render();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});

/* ---------- avvio ---------- */
async function boot() {
  await Store.open();
  let raw = null, str = null;
  try { str = await Store.get('state'); if (str) raw = JSON.parse(str); }
  catch (e) {
    console.error(e);
    try { if (str) await Store.put('corrupt-' + Date.now(), str); } catch (e2) { /* */ }
    setTimeout(() => ask({ title: 'Dati non leggibili', msg: 'I dati salvati sembrano danneggiati: l\'app riparte vuota (una copia è stata conservata). Puoi ripristinare un backup da Impostazioni.', buttons: [{ label: 'OK', value: 1, style: 'primary' }] }), 300);
  }
  try { S = sanitize(raw); } catch (e) { console.error(e); S = defaultState(); }
  if (!raw) await flush();
  try { runRecurring(); } catch (e) { console.error(e); }
  render();
  requestPersist();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW', err));
  }
  // al ritorno in primo piano: nuovo giorno → aggiorna
  let lastDay = today();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && today() !== lastDay) { lastDay = today(); UI.tipDay = today(); runRecurring(); render(); }
  });
}
boot();
</script>
